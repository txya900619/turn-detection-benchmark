[project]
name = "turn-eval-easy-turn"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.7.0",
    "gxl-ai-utils",
    "huggingface-hub==0.30.2",
    "librosa>=0.11,<0.12",
    "openai-whisper==20250625",
    "peft==0.17.0",
    "pyyaml>=6,<7",
    "scikit-learn>=1.6,<2",
    "torch==2.7.0",
    "torchaudio==2.7.0",
    "transformers==4.44.0",
    "turn-detection-benchmark",
]

[tool.uv]
package = false

[tool.uv.sources]
turn-detection-benchmark = { path = "../..", editable = true }
